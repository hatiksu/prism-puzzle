name: Release

# Установщик .exe собирается на Windows и публикуется в Releases с тегом v<версия>.
# Релиз создаётся при пуше в main, если для версии из package.json его ещё нет:
# чтобы выпустить новую версию, достаточно поднять "version" в package.json.
# Ручной запуск: Actions → Release → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Есть ли новая версия
    # Релизы живут только в отдельном репозитории приложения
    if: github.repository == 'hatiksu/prism-puzzle'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Релиз v${{ steps.version.outputs.version }} уже есть — поднимите version в package.json, чтобы выпустить новый"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Установщик для Windows
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка приложения для десктопа
        run: npm run build
        env:
          DESKTOP: '1'
      - name: Установщик .exe
        run: npx electron-builder --win nsis --publish never
      - name: Файл установщика в артефакты запуска
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          make_latest: 'true'
          files: release/*.exe
          body: |
            ## Установка

            1. Скачайте `prism-puzzle-Setup-${{ needs.check.outputs.version }}.exe` ниже и запустите.
            2. Если Windows покажет «Система Windows защитила ваш компьютер» — нажмите **Подробнее → Выполнить в любом случае**. Установщик не подписан платным сертификатом, поэтому SmartScreen его не знает.
            3. Выберите папку — ярлык «Призма» появится на рабочем столе и в меню «Пуск».

            Windows 10 и 11, 64 бита.
